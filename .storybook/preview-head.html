<!-- У застосунку шрифти Geist дає next/font (змінні --font-geist-*); у Storybook їх немає, і без змінної весь font-family
     стає недійсним (шрифт із засічками). Системні запасні — лише для перегляду. -->
<style>
  :root {
    --font-geist-sans: ui-sans-serif, system-ui, sans-serif;
    --font-geist-mono: ui-monospace, SFMono-Regular, monospace;
  }
</style>
