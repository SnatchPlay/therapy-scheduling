# E2E (Playwright): AC, що їх перевіряють у браузері — tests/e2e/**/*.spec.ts (ac:coverage рахує їх лише завдяки цьому
# workflow). Збирається код PR (npm run build) і працює на localhost:3000 проти ОДНОРАЗОВОЇ локальної бази Supabase в
# раннері (supabase start; міграції цього PR), а не проти вашого прода: у прод job нічого не пише й не читає.
# Передумови тестів дає tests/e2e/fixtures/e2e-data.sql (клієнт лише для therapist2, утримання для списку планувальника);
# доводить його tests/db/e2e-fixture-db.test.ts. Акаунти *@example.test створює scripts/create-demo-users.mjs з випадковим
# паролем цього прогону: секретів і змінних репозиторію не потрібно. Тести лише читають; пишеться лише в локальну базу.
# Без перевірки агента-рецензента: вона й звіт для PM — `npm run uat` проти прода (docs/qa/uat/).
#
# На стан прод-UAT це не впливає: `npm run uat` читає живі дані прода (docs/qa/proof-pack.md, розділ C).
# НЕ додавати цей job в обов'язкові перевірки ruleset-у `solo-main`, поки діє фільтр `paths` нижче: PR без цих шляхів
# (наприклад, лише `docs/**`) job не запускає, і обов'язкова перевірка висіла б «Expected — waiting».
name: e2e

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/create-demo-users.mjs"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# Новий push у PR скасовує застарілий прогін цього PR (як у ci.yml).
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "E2E: Playwright"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Лише те, що потрібне застосунку: база, Auth (gotrue), REST (postgrest) і шлюз (kong).
      - name: Одноразова локальна база Supabase (міграції цього PR)
        run: npx supabase start -x studio,realtime,storage-api,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Акаунти e2e й дані передумов
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          : "${API_URL:?supabase status не віддав API_URL}" "${PUBLISHABLE_KEY:?немає PUBLISHABLE_KEY}" "${SECRET_KEY:?немає SECRET_KEY}"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "DEMO_USER_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" DEMO_USER_PASSWORD="$password" \
            node scripts/create-demo-users.mjs
          npx supabase db query --local -f "$PWD/tests/e2e/fixtures/e2e-data.sql"
      - run: npx playwright install --with-deps chromium
      - name: Збірка застосунку (код цього PR)
        run: npm run build
      # playwright.config.ts: без UAT_BASE_URL піднімає `npm run start` на localhost:3000 і спершу виконує setup входу ролей.
      - name: Playwright (chromium)
        run: npx playwright test --project=chromium
      # Лише кадри, відео й пояснення помилок: trace.zip не вантажимо (у ньому заголовки запитів, зокрема cookie сесій).
      - name: Докази впалого прогону
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            test-results/artifacts/**/*.png
            test-results/artifacts/**/*.webm
            test-results/artifacts/**/error-context.md
          retention-days: 3
          if-no-files-found: ignore
