# Storybook збирається окремим workflow (ci.yml і назви його jobs не чіпаємо: на них тримається ruleset).
# Перевірка не обов'язкова для merge, але червона збірка показує, що історія компонента зламалась.
name: storybook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: "Storybook: збірка"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
